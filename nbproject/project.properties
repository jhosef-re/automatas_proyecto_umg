build.generated.sources.dir=${build.dir}/generated-sources
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
javac.source=17
javac.target=17
# Project properties
application.title=Proyecto Automatas
application.vendor=Jhosef Reyes
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form,**/*.class
# NO *.java in build.classes
build.dir=build
build.test.classes.dir=${build.dir}/test-classes
build.test.results.dir=${build.dir}/test-results
debug.classpath=\
    ${javac.test.classpath}:\
    ${run.classpath}
debug.test.classpath=\
    ${run.classpath}:\
    ${build.test.classes.dir}
# Encodings
encoding=UTF-8
# Excludes
excludes=
file.reference.junit-standalone=lib/junit-platform-console-standalone-1.10.2.jar
file.reference.openpdf=lib/openpdf-1.3.43.jar
includes=**
jar.compress=false
javac.classpath=\
    ${file.reference.openpdf}
javac.compilerargs=
javac.deprecation=false
javac.externalvm=false
javac.modulepath=
javac.processormodulepath=
javac.processorpath=
javac.test.classpath=\
    ${javac.classpath}:\
    ${file.reference.junit-standalone}
javac.test.modulepath=\
    ${javac.modulepath}
# Java platform: por default usa el JDK bundled de NetBeans (cumple el requisito "17+").
# El sandbox de Flatpak no puede ver /usr/lib/jvm/, por eso hay una copia en
# ~/.local/share/jdk17/ (ver CHECKLIST_INSTALACION.md sección 2).
# javac/target = 17 fuerzan que el código se compile con JDK 17.
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${encoding}
javadoc.html5=false
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=
main.class=automatas.Main
manifest.file=manifest.mf
meta.inf.dir=${src.dir}/META-INF
mkdist.disabled=false
# platform.active: dejarlo SIN asignar para que NetBeans use su JDK bundled.
# Si querés usar el JDK 17 copiado en ~/.local/share/jdk17/:
#   1. Tools > Java Platforms > Add Platform > Java Standard Edition
#      Apuntar a: /home/re/.local/share/jdk17  (NO /usr/lib/jvm/ — está fuera del sandbox)
#   2. Project > Properties > Libraries > Java Platform → seleccionar la plataforma JDK 17
#   3. Re-abrir NetBeans para que tome el cambio
project.license=Evaluacion Proyecto Autómatas
run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
run.jvmargs=
run.modulepath=\
    ${javac.modulepath}
run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}
run.test.modulepath=\
    ${javac.test.modulepath}
#src.dir y test.src.dir
src.dir=src
test.src.dir=test
